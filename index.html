<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script><title>TRADING ARENA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap');
:root{--c:#00f0ff;--m:#ff2bd6;--g:#39ff88;--r:#ff3860}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#05060a;color:#d8f6ff;font-family:'Orbitron','Noto Sans TC',sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px);background-size:40px 40px;animation:grid 20s linear infinite;z-index:-1}
@keyframes grid{to{background-position:0 40px,40px 0}}
.wrap{max-width:1200px;margin:auto;padding:32px}
h1{font-size:42px;letter-spacing:6px;margin:0;color:#fff;text-shadow:0 0 8px var(--c),0 0 24px var(--c),0 0 48px var(--m);animation:flick 4s infinite}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.6}97%{opacity:1}98%{opacity:.7}}
.sub{color:var(--m);text-shadow:0 0 8px var(--m);margin:8px 0 28px;letter-spacing:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{position:relative;padding:24px;border-radius:16px;background:rgba(10,14,24,.8);border:1px solid var(--c);box-shadow:0 0 18px rgba(0,240,255,.35),inset 0 0 18px rgba(0,240,255,.1);opacity:0;transform:translateY(20px);animation:in .8s ease forwards;transition:transform .3s,box-shadow .3s}
.card:nth-child(2){border-color:var(--m);box-shadow:0 0 18px rgba(255,43,214,.35),inset 0 0 18px rgba(255,43,214,.1);animation-delay:.15s}
.card:hover{transform:translateY(-4px) scale(1.01)}
@keyframes in{to{opacity:1;transform:none}}
.card h2{margin:0 0 14px;letter-spacing:3px}.big{font-size:36px;font-weight:800}
.row{display:flex;justify-content:space-between;margin:6px 0;color:#9bb}
.bar{height:10px;border-radius:6px;background:#111a;overflow:hidden;margin-top:6px;border:1px solid #234}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--m));box-shadow:0 0 12px var(--c);transition:width 1.5s cubic-bezier(.2,.8,.2,1)}
.pos{color:var(--g);text-shadow:0 0 8px var(--g)}.neg{color:var(--r);text-shadow:0 0 8px var(--r)}
table{width:100%;border-collapse:collapse;margin-top:36px;background:rgba(10,14,24,.8);border:1px solid #1d3a4a;border-radius:12px;overflow:hidden;font-family:'Noto Sans TC',sans-serif}
th{color:var(--c);text-align:left;padding:12px;font-family:Orbitron;font-size:12px;letter-spacing:2px;border-bottom:1px solid var(--c)}
td{padding:12px;border-bottom:1px solid #12222c}tbody tr{opacity:0;animation:in .5s ease forwards;transition:background .2s}tbody tr:hover{background:rgba(0,240,255,.08)}
.clock{float:right;color:var(--c);font-size:14px;text-shadow:0 0 6px var(--c)}
</style>
<div class="wrap"><span class="clock" id="clk"></span><h1>TRADING ARENA</h1>
<div class="sub">禁止現貨 ／ 全標的、可多持倉</div>
<div class="cards" id="cards"></div>
<div class="card" style="opacity:1;transform:none;animation:none;margin-top:28px;border-color:#7a5cff"><h2>資產變化</h2><canvas id="eqc" height="110"></canvas></div><table><thead><tr><th>TIME (台灣)</th><th>TRADER</th><th>MARKET</th><th>SIDE</th><th>PRICE</th><th>QTY</th><th>PNL</th><th>NOTE</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
setInterval(()=>clk.textContent=new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})+' 台灣',1000);
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
let h='';for(const [n,t] of Object.entries(d.traders)){const ts=d.trades.filter(x=>x.trader==n),eq=t.equity??(t.start+ts.reduce((a,x)=>a+x.pnl,0)),p=eq-t.start,
hr=ts.filter(x=>Date.now()-new Date(x.time.replace(' ','T')+'+08:00')<3600e3).length,dc=ts.filter(x=>x.time.slice(0,10)==new Date().toLocaleDateString("sv",{timeZone:"Asia/Taipei"})).length,db=t.day_base??t.start,dp=(eq/db-1)*100,prog=Math.max(0,Math.min(100,dp/30*100));
h+=`<div class="card"><h2>${n}</h2><div class="big">${eq.toFixed(2)} <small style="font-size:14px">USDT</small></div>
<div class="row"><span>報酬率</span><b class="${p>=0?'pos':'neg'}">${p>=0?'+':''}${(p/t.start*100).toFixed(2)}%</b></div>
<div class="row"><span>起始資金</span><span>${(+t.start).toFixed(0)} U${t.deposited?`（含追加 ${(+t.deposited).toFixed(0)}）`:''}</span></div>
<div class="row" style="margin-top:12px"><span>總筆數</span><span>${t.fills_total??ts.length+'（僅近期）'}</span></div>
${(t.positions||[]).map(o=>`<div class="row"><span>持倉 ${o.inst} ${o.side=="long"?"多":"空"} ${o.sz}張 @${+(+o.avgPx).toPrecision(6)}</span><b class="${+o.upl>=0?"pos":"neg"}">${(+o.upl).toFixed(2)}</b></div>`).join("")}<div class="row"><span>累計手續費</span><span class="neg">${t.fees_total!=null?(-Math.abs(+t.fees_total)).toFixed(3)+' U':ts.reduce((a,x)=>a+(x.fee||0),0).toFixed(3)+' U（僅近期）'}</span></div>${t.funding_total!=null?`<div class="row"><span>累計資金費</span><span class="${+t.funding_total>=0?"pos":"neg"}">${(+t.funding_total).toFixed(3)} U</span></div>`:""}<div class="row"><span>今日筆數</span><span>${dc}</span></div><div class="row"><span>近 1 小時</span><span>${hr}</span></div></div>`}
cards.innerHTML=h;setTimeout(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'),300);
rows.innerHTML=d.trades.slice().reverse().map((x,i)=>`<tr style="animation-delay:${.3+i*.08}s"><td>${x.time.slice(11)}</td><td>${x.trader}</td><td>${x.market}</td><td>${x.side}</td><td>${x.price}</td><td>${x.qty}</td><td class="${x.pnl>=0?'pos':'neg'}">${x.pnl}</td><td>${x.note}</td></tr>`).join('')});
setTimeout(()=>location.reload(),30000);

fetch('history.json?'+Date.now()).then(r=>r.json()).then(H=>{const col={"交易員1":"#00f0ff","交易員2":"#ff2bd6"};
new Chart(eqc,{type:'line',data:{datasets:[].concat(Object.entries(H).map(([n,p])=>({label:n,data:p.map(([x,y])=>({x,y})),segment:{borderDash:c=>c.p1.parsed.x-c.p0.parsed.x>5400e3?[4,4]:undefined},borderColor:col[n],backgroundColor:col[n]+'22',fill:true,tension:.3,pointRadius:0,borderWidth:2})))},
options:{animation:{duration:1200},parsing:false,scales:{x:{type:'linear',ticks:{color:'#9bb',callback:v=>new Date(v).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false})},grid:{color:'#12222c'}},y:{ticks:{color:'#9bb'},grid:{color:'#12222c'}}},
plugins:{legend:{labels:{color:'#d8f6ff'}},annotation:{}}}})});
</script></html>
