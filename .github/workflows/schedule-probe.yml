name: Temporary schedule trigger probe

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  verify-scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Record the trigger only
        env:
          TRIGGER_KIND: ${{ github.event_name }}
          SCHEDULE_ACTOR: ${{ github.actor }}
        run: |
          printf 'event=%s actor=%s\n' "$TRIGGER_KIND" "$SCHEDULE_ACTOR"
          date -u '+observed_at=%Y-%m-%dT%H:%M:%SZ'
