name: Update trading dashboard

# Pages-only deploy. The desktop (TraderDashPush) pushes data.json/history.json
# to main; this workflow publishes them. It never reads OKX and uses no secrets.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: race-dashboard-publish
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Fadinggo/race' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate data.json and package the public site
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data.json', encoding='utf-8-sig'))
          assert isinstance(d.get('traders'), dict) and isinstance(d.get('trades'), list), 'bad data.json'
          print('data.json updated:', d.get('generated_at'))
          PY
          site="$RUNNER_TEMP/race-pages"
          mkdir -p "$site"
          for f in index.html dashboard.js layout-v4.js data.json history.json .nojekyll; do
            cp -- "$f" "$site/"
          done
          for f in notes.json watchlist.json; do
            if [[ -f "$f" && ! -L "$f" ]]; then cp -- "$f" "$site/"; fi
          done

      - name: Upload only the public website files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/race-pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy this workflow's artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4