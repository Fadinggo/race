name: Update trading dashboard

on:
  schedule:
    # About every five minutes; avoid the top-of-hour scheduling peak.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First connection only: create an authenticated checkpoint from the pending-connection snapshot'
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: race-dashboard-publish
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'Fadinggo/race' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify the data and publication helpers
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Read the two OKX accounts and preserve authenticated state
        timeout-minutes: 4
        env:
          OKX_A_API_KEY: ${{ secrets.OKX_A_API_KEY }}
          OKX_A_SECRET_KEY: ${{ secrets.OKX_A_SECRET_KEY }}
          OKX_A_PASSPHRASE: ${{ secrets.OKX_A_PASSPHRASE }}
          OKX_API_KEY: ${{ secrets.OKX_B_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_B_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_B_PASSPHRASE }}
          DASHBOARD_STATE_KEY: ${{ secrets.DASHBOARD_STATE_KEY }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && 'true' || 'false' }}
        shell: bash
        run: |
          arguments=()
          if [[ "$BOOTSTRAP" == "true" ]]; then
            arguments+=(--bootstrap)
          fi
          python scripts/gha_snapshot.py \
            --config config.example.json \
            --output "$GITHUB_WORKSPACE" \
            --checkpoint "$GITHUB_WORKSPACE/state-checkpoint.json" \
            --state-dir "$RUNNER_TEMP/race-private-state" \
            "${arguments[@]}"

      - name: Commit the three snapshot files and prepare the public site
        run: >-
          python scripts/gha_publish.py
          --repo "$GITHUB_WORKSPACE"
          --site-dir "$RUNNER_TEMP/race-pages"

      - name: Upload only the public website files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/race-pages
          retention-days: 1

  deploy:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy this workflow's artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
