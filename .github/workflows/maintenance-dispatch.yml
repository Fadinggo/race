name: Prepare maintenance work order

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing owner-authored maintenance Issue number'
        required: true
        type: string

permissions: {}

concurrency:
  group: race-maintenance-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'Fadinggo/race' && github.actor == 'Fadinggo' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'codex-maintenance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the trusted controller from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare an authorized work-order branch
        run: python3 scripts/maintenance_dispatch.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
